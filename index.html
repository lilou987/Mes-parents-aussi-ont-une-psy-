<!DOCTYPE html>
<html>
<head>
  <title>Mon site</title>
  <style>
    body {
      margin: 0;
      font-family: Arial;
      background: linear-gradient(to right, #667eea, #764ba2);
      color: white;
      text-align: center;
    }

    .container {
      padding: 100px 20px;
    }

    h1 {
      font-size: 50px;
    }

    p {
      font-size: 20px;
    }

    button {
      padding: 15px 30px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #333;
      cursor: pointer;
    }

    button:hover {
      background: #ddd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bienvenue sur mon site 🚀</h1>
    <p>Mon site est maintenant en ligne avec GitHub Pages !</p>
    <button onclick="alert('Merci de ta visite ❤️')">Clique ici</button>
  </div>

</body>
</html>
